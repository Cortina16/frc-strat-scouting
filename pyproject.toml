[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frc-scouting"
version = "0.1.0"
description = "Enterprise-Grade Automated Video Scouting Pipeline for FRC 2026 REBUILT"
readme = "SPEC.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "FRC Scouting Architecture Team" }
]
keywords = [
    "frc",
    "robotics",
    "computer-vision",
    "distributed-systems",
    "ray",
    "tensorrt",
    "duckdb",
    "mqtt",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    # Distributed Scheduling & Actor Runtime (SPEC § Distributed Infrastructure)
    "ray[default]==2.38.0",

    # High-Performance Deep Learning Inference (SPEC § High-Fidelity Object Detection)
    "tensorrt==10.3.0",

    # Computer Vision & Image Processing (SPEC § Dynamic Homography & Tracking)
    "opencv-python-headless==4.10.0.84",

    # In-Process Analytical OLAP Database & Parquet Engine (SPEC § DuckDB Trajectory Analytics)
    "duckdb==1.1.3",

    # Ultra-Low-Bandwidth Client Transport (SPEC § Client Synchronization)
    "paho-mqtt==2.1.0",

    # Binary Serialization Schema (SPEC § Ultra-Low-Bandwidth Transport)
    "protobuf==5.28.3",

    # Deep Learning Framework for Real-ESRGAN, ActionFormer, & ResNet Gating
    "torch==2.4.1",
    "torchvision==0.19.1",

    # Numerical, Scientific & Optimization Routines (DLT, SVD, Levenberg-Marquardt)
    "numpy==1.26.4",
    "scipy==1.13.1",

    # Configuration & Schema Validation
    "pydantic==2.9.2",
    "pyyaml==6.0.2",

    # Fast Video I/O & Decoding
    "av==13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-mock==3.14.0",
    "mypy==1.11.2",
    "ruff==0.6.9",
    "grpcio-tools==1.66.2",
    "types-protobuf==5.28.0.20240924",
    "types-pyyaml==6.0.12.20240917",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "proto*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
